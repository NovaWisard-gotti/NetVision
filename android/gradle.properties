org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# AGP 9+ only reads the new Android DSL by default; opt out to keep
# using the existing Groovy build.gradle files without a full migration.
android.newDsl=false

# Retry dependency downloads with backoff before failing. Shared CI
# runners occasionally get rate-limited (HTTP 429) by Maven Central /
# plugins.gradle.org; this makes transient failures far less likely.
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=1000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
